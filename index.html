<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSphere — Smart School Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<div id="particles" aria-hidden="true">
  <div class="school-3d-scene">
    <div class="school-3d-building">
      <div class="school-roof"></div>
      <div class="school-front">
        <i class="fa-solid fa-school"></i>
        <span class="school-sign">LEARN • GROW • LEAD</span>
        <div class="school-windows"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="school-door"></div>
      </div>
      <div class="school-side"></div>
      <div class="school-ground"></div>
    </div>
    <i class="school-float school-cap fa-solid fa-graduation-cap"></i>
    <i class="school-float school-book fa-solid fa-book-open"></i>
    <i class="school-float school-bus fa-solid fa-bus"></i>
    <i class="school-float school-pencil fa-solid fa-pencil"></i>
    <i class="school-float school-globe fa-solid fa-earth-asia"></i>
    <i class="school-float school-flask fa-solid fa-flask"></i>
    <i class="school-float school-backpack fa-solid fa-backpack"></i>
    <i class="school-float school-ruler fa-solid fa-ruler"></i>
    <i class="school-float school-bell fa-solid fa-bell"></i>
    <i class="school-float school-calculator fa-solid fa-calculator"></i>
    <i class="school-float school-palette fa-solid fa-palette"></i>
    <i class="school-float school-pencil-alt fa-solid fa-pen"></i>
  </div>
</div>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></div><div><b>EduSphere</b><small>SMART SCHOOL ERP</small></div><button class="icon-btn mobile-close" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="school-switch"><div class="school-avatar">ES</div><div><b id="schoolLabel">Evergreen Public School</b><small>Academic year 2026–27</small></div><i class="fa-solid fa-chevron-down"></i></div>
  <div class="nav-label">WORKSPACE</div>
  <nav id="mainNav">
    <button class="nav-link active" data-page="dashboard"><i class="fa-solid fa-grid-2"></i>Dashboard</button>
    <button class="nav-link" data-page="students"><i class="fa-solid fa-user-graduate"></i>Students <span class="nav-count" id="studentNavCount">0</span></button>
    <button class="nav-link" data-page="classes"><i class="fa-solid fa-chalkboard"></i>Classes & Sections</button>
    <button class="nav-link" data-page="teachers"><i class="fa-solid fa-person-chalkboard"></i>Teachers & Staff</button>
    <button class="nav-link" data-page="attendance"><i class="fa-solid fa-calendar-check"></i>Attendance</button>
    <button class="nav-link" data-page="fees"><i class="fa-solid fa-wallet"></i>Fees & Payments</button>
    <div class="nav-label nav-spaced">ACADEMICS</div>
    <button class="nav-link" data-page="exams"><i class="fa-solid fa-file-lines"></i>Examinations</button>
    <button class="nav-link" data-page="timetable"><i class="fa-solid fa-table"></i>Timetable</button>
    <button class="nav-link" data-page="homework"><i class="fa-solid fa-book-open"></i>Homework</button>
    <div class="nav-label nav-spaced">CAMPUS</div>
    <button class="nav-link" data-page="library"><i class="fa-solid fa-book"></i>Library</button>
    <button class="nav-link" data-page="transport"><i class="fa-solid fa-bus"></i>Transport</button>
    <button class="nav-link" data-page="notices"><i class="fa-solid fa-bullhorn"></i>Notices & Events</button>
    <button class="nav-link" data-page="reports"><i class="fa-solid fa-chart-pie"></i>Reports</button>
  </nav>
  <div class="sidebar-bottom"><button class="nav-link" data-page="settings"><i class="fa-solid fa-gear"></i>Settings</button><div class="help-card"><div class="help-icon"><i class="fa-regular fa-circle-question"></i></div><b>Need a hand?</b><small>Explore the demo and manage your school.</small></div><div class="profile-mini"><div class="avatar">AS</div><div><b>Aniket Sahgal</b><small>Administrator</small></div><button class="icon-btn" title="Profile"><i class="fa-solid fa-ellipsis"></i></button></div></div>
</aside>
<main class="main-area">
<header class="topbar"><div class="top-left"><button class="icon-btn menu-btn" id="openSidebar"><i class="fa-solid fa-bars"></i></button><div class="breadcrumb">Workspace <i class="fa-solid fa-chevron-right"></i> <b id="crumb">Dashboard</b></div></div><div class="top-actions"><div class="date-chip"><i class="fa-regular fa-calendar"></i><span id="todayLabel"></span></div><button class="icon-btn notification-btn" title="Notifications"><i class="fa-regular fa-bell"></i><span></span></button><button class="theme-toggle" id="themeToggle" title="Toggle theme"><i class="fa-solid fa-moon"></i></button><div class="top-avatar">AS</div></div></header>
<div class="content" id="content"></div>
<footer>© 2026 EduSphere School ERP <span>Built for smarter school operations</span></footer>
</main>
</div>
<div class="toast-stack" id="toastStack"></div><div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<script src="js/app.js"></script>
</body></html>
